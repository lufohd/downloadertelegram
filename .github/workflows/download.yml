name: Download from Telegram

on:
  workflow_dispatch:
    inputs:
      message_link:
        description: "آیدی عددی پیام (با TELEGRAM_CHANNEL_ID) یا لینک کامل پیام"
        required: true
        type: string
  repository_dispatch:
    types: [telegram_file]

jobs:
  download-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download file from Telegram
        id: dl
        timeout-minutes: 30
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_USER_CHAT_ID: ${{ github.event.client_payload.user_chat_id }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          MESSAGE_LINK: ${{ github.event.inputs.message_link || github.event.client_payload.message_id }}
        run: python scripts/download.py

      - name: Debug output value
        run: |
          echo "file_path output: ${{ steps.dl.outputs.file_path }}"
          echo "--- محتوای پوشه downloads ---"
          ls -lh downloads/ || echo "پوشه downloads پیدا نشد یا خالیه"

      - name: Create GitHub Release with the file
        id: release
        timeout-minutes: 15
        uses: softprops/action-gh-release@v2
        with:
          tag_name: file-${{ github.run_id }}
          name: "فایل دانلودشده - ${{ github.run_id }}"
          files: downloads/*

      - name: Notify user on Telegram
        if: github.event_name == 'repository_dispatch'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          USER_CHAT_ID: ${{ github.event.client_payload.user_chat_id }}
          ASSETS_JSON: ${{ steps.release.outputs.assets }}
          FALLBACK_URL: https://github.com/${{ github.repository }}/releases/tag/file-${{ github.run_id }}
        run: |
          DOWNLOAD_URL=$(echo "$ASSETS_JSON" | python3 -c "import json,sys; data=json.load(sys.stdin); print(data[0]['browser_download_url'])" 2>/dev/null || echo "")
          if [ -z "$DOWNLOAD_URL" ]; then
            DOWNLOAD_URL="$FALLBACK_URL"
          fi
          MSG="فایل آماده شد! ${DOWNLOAD_URL}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d chat_id="${USER_CHAT_ID}" --data-urlencode "text=${MSG}"

      - name: Notify user on failure
        if: failure() && github.event_name == 'repository_dispatch'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          USER_CHAT_ID: ${{ github.event.client_payload.user_chat_id }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d chat_id="${USER_CHAT_ID}" --data-urlencode "text=دانلود یا ریلیز با خطا مواجه شد. لاگ رو توی تب Actions چک کن."

